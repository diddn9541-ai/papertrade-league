<style>/* 모의투자 리그 — 차분한 숫자 중심 UI. 두께 400/600만 사용 */
@font-face{font-family:"Pretendard";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/Pretendard-Regular.subset.woff2) format("woff2")}
@font-face{font-family:"Pretendard";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/Pretendard-SemiBold.subset.woff2) format("woff2")}
:root{
  --bg:#0B0B0F;--surface:#15161B;--surface2:#1D1F25;--line:#25272E;
  --t1:#F2F3F5;--t2:#B0B5BF;--t3:#8A909B;
  --up:#F45A67;--down:#5C9DFF;--accent:#3182F6;--accent-t:#6BA6FF;
  --warn:#E8A33D;--chip:#22242B;
  --r:16px;--r-s:12px;--pad:20px;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t1)}
body{font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:15px;line-height:1.5;font-weight:400;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere;
  padding-bottom:calc(64px + env(safe-area-inset-bottom))}
b,strong,h1,h2,h3{font-weight:600}
h1,h2,h3,p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--t2)}
.t2{color:var(--t2)}.t3{color:var(--t3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

#app{max-width:560px;margin:0 auto}
.view{padding:calc(12px + env(safe-area-inset-top)) var(--pad) 32px;animation:in .18s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* 상단 */
.top{display:flex;align-items:center;justify-content:space-between;min-height:48px;gap:12px}
.top h1{font-size:20px;letter-spacing:-.02em}
.back{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:-12px;border-radius:12px}
.back svg{width:24px;height:24px;stroke:var(--t1);fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.mkt{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:99px;background:var(--chip);font-size:12px;color:var(--t2);white-space:nowrap}
.mkt i{width:6px;height:6px;border-radius:50%;background:var(--t3)}
.mkt.on{color:var(--t1)}.mkt.on i{background:var(--up);animation:pulse 1.6s ease-in-out infinite}
.mkt.stale i{background:var(--warn)}
@keyframes pulse{50%{opacity:.35}}
.meta{font-size:12px;color:var(--t3);margin-top:2px}
.season{display:flex;align-items:center;gap:6px;margin-top:20px;height:36px;padding:0 12px;border-radius:10px;background:var(--surface);font-size:13px;color:var(--t2);width:max-content;max-width:100%}
.season .dot{color:var(--t3)}
.sec-first{margin-top:24px}

/* 규칙 한 줄 */
.rule{margin:20px 0 4px;padding:0 0 20px;border-bottom:1px solid var(--line)}
.rule .lb{font-size:12px;color:var(--t3);margin-bottom:4px}
.rule p{font-size:17px;font-weight:600;line-height:1.45;letter-spacing:-.02em}
.rule .r2{font-size:13px;color:var(--t2);margin-top:6px;font-weight:400}

/* 섹션 */
.sec{margin-top:32px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.sec-h h2{font-size:17px;letter-spacing:-.02em}
.sec-h .t3{font-size:13px}

/* 리스트 행 */
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 0;border-radius:12px;transition:background .15s var(--ease)}
a.row:active,button.row:active{background:var(--surface)}
.row .main{flex:1;min-width:0}
.row .nm{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:13px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{text-align:right;flex:none}
.row .big{font-size:17px;font-weight:600}
.row .sm{font-size:13px}
.rank{width:20px;flex:none;text-align:center;font-size:15px;font-weight:600;color:var(--t2)}
.mono{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;letter-spacing:-.03em}
.mono.s{width:28px;height:28px;font-size:11px;letter-spacing:-.04em}
.mono.l{width:48px;height:48px;font-size:19px}
.tick{flex:none;width:40px;height:40px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--t2);letter-spacing:0}
.pfl{font-size:11px;color:var(--t3);margin-right:4px;font-weight:400}

/* 카드 */
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.card+.card{margin-top:8px}
.empty{color:var(--t3);font-size:14px;padding:24px 0;text-align:center}
.note-warn{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:var(--r-s);padding:12px 14px;font-size:13px;color:var(--t2);margin-top:16px}
.note-warn i{flex:none;width:6px;height:6px;margin-top:7px;border-radius:50%;background:var(--warn)}

/* 칩 */
.chip{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;background:var(--chip);font-size:12px;color:var(--t2);white-space:nowrap}
.chip.ok{background:var(--t1);color:var(--bg);font-weight:600}.chip.no{color:var(--t2);box-shadow:inset 0 0 0 1px var(--line)}.chip.wait{color:var(--t1)}.chip.warn{color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filters{display:flex;gap:4px;overflow-x:auto;margin:8px -4px 8px;padding:0 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters a{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px}
.filters a span{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:99px;background:var(--chip);color:var(--t2);font-size:14px;transition:background .15s,color .15s}
.filters a.on span{background:var(--t1);color:var(--bg);font-weight:600}

/* 플레이어 헤더 */
.ph{margin-top:8px}
.ph .who{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--t2)}
.ph .eq{font-size:32px;font-weight:600;letter-spacing:-.03em;margin-top:12px;line-height:1.2}
.ph .pl{font-size:15px;margin-top:2px}
.ph .vs{font-size:13px;color:var(--t3);margin-top:2px}

/* 차트 */
.chart{position:relative;margin:16px calc(-1 * var(--pad)) 0;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%;height:200px;overflow:visible}
.chart .tip{position:absolute;top:-4px;transform:translateX(-50%);background:var(--surface2);border-radius:8px;padding:4px 8px;font-size:12px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s}
.chart.scrub .tip{opacity:1}
.legend{display:flex;gap:16px;font-size:12px;color:var(--t3);margin-top:8px}
.legend i{display:inline-block;width:12px;height:2px;border-radius:2px;vertical-align:middle;margin-right:6px}

/* 지표 그리드 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);row-gap:16px;column-gap:12px;background:var(--surface);border-radius:var(--r);padding:16px;margin-top:24px}
.stats>div{min-width:0}
.stats .lb{font-size:12px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats .v{font-size:17px;font-weight:600;margin-top:2px;white-space:nowrap}

/* 가설 카드 */
.hyp{background:var(--surface);border-radius:var(--r);padding:16px}
.hyp+.hyp{margin-top:8px}
.hyp .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hyp .sym{font-size:13px;color:var(--t2);font-weight:600}
.hyp h3{font-size:16px;line-height:1.45;margin:8px 0 12px;letter-spacing:-.02em}
.hyp .ln{display:flex;gap:10px;font-size:14px;line-height:1.5;padding:2px 0}
.hyp .ln b{flex:none;width:44px;font-size:13px;color:var(--t3);font-weight:400;padding-top:1px}
.hyp details{margin-top:8px;border-top:1px solid var(--line)}
.hyp summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:44px;font-size:13px;color:var(--t2);cursor:pointer}
.hyp summary::-webkit-details-marker{display:none}
.hyp summary::after{content:"";width:8px;height:8px;border-right:1.5px solid var(--t3);border-bottom:1.5px solid var(--t3);transform:rotate(45deg) translateY(-3px);transition:transform .18s var(--ease)}
.hyp details[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
.hyp details .body{font-size:14px;color:var(--t2);padding-bottom:8px}
.hyp .ft{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:var(--t3)}
.hyp .res{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
.hyp .res .lb{font-size:12px;color:var(--t3)}
.amend{font-size:13px;color:var(--t2);padding:6px 0;border-top:1px dashed var(--line)}
.amend:first-child{border-top:0}
.amend .old{text-decoration:line-through;color:var(--t3)}

/* 세그먼트 */
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;margin:8px 0 12px}
.seg a{flex:1;text-align:center;min-height:38px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:14px;color:var(--t2);transition:background .15s,color .15s}
.seg a.on{background:var(--surface2);color:var(--t1);font-weight:600}

/* 타임라인 */
.day{font-size:13px;color:var(--t3);margin:24px 0 4px;font-weight:600}
.day:first-child{margin-top:8px}
.ev{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .tm{flex:none;width:40px;font-size:13px;color:var(--t3);padding-top:2px}
.ev .bd{flex:1;min-width:0}
.ev .l1{display:flex;align-items:center;gap:8px;font-size:15px}
.ev .l1 .amt{margin-left:auto;font-weight:600;white-space:nowrap}
.ev .l2{font-size:13px;color:var(--t3);margin-top:2px}
.ev .hq{font-size:13px;color:var(--t2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ev.vd .bd{border-left:2px solid var(--line);padding-left:12px}
.ev.vd.ok .bd{border-left-color:var(--t2)}.ev.vd.no .bd{border-left-color:var(--line)}
.ev .lesson{font-size:14px;margin-top:6px}

/* 오답노트 */
.lsn{padding:16px 0;border-bottom:1px solid var(--line)}
.lsn:last-child{border-bottom:0}
.lsn .hd{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t3)}
.lsn p{font-size:16px;line-height:1.55;margin-top:8px;letter-spacing:-.015em}
.lsn .sc{font-size:13px;color:var(--t3);margin-top:6px}

/* 규칙 화면 */
.rl{font-size:15px;line-height:1.6;color:var(--t2);padding-left:18px;margin:0}
.rl li{margin:6px 0}
.big-rule{font-size:20px;font-weight:600;line-height:1.45;letter-spacing:-.02em}
.erow{display:flex;align-items:center;justify-content:space-between;min-height:52px;border-bottom:1px solid var(--line);font-size:15px}
.erow:last-child{border-bottom:0}
.erow .sub{font-size:12px;color:var(--t3)}
.disc{font-size:12px;color:var(--t3);line-height:1.6;margin-top:32px}

/* 탭바 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:color-mix(in srgb,var(--bg) 92%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:60px;font-size:11px;color:var(--t3);transition:color .15s}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.tabbar a.on{color:var(--t1)}
.tabbar a.on span{font-weight:600}

/* 스켈레톤 */
.sk{background:var(--surface);border-radius:10px;margin-bottom:12px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);animation:sh 1.2s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.sk-t{height:28px;width:45%;margin-top:12px}.sk-s{height:16px;width:70%}.sk-b{height:64px;margin:24px 0}.sk-r{height:56px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.ev .who{color:var(--t2)}
.ev .lesson .lb{font-size:12px;color:var(--t3);margin-right:6px}
.lsn .kvs{margin-top:10px;display:grid;gap:4px}
.lsn .kv{display:grid;grid-template-columns:64px 1fr;gap:8px;font-size:13px}
.lsn .scs{margin-top:10px;display:grid;gap:4px;padding-top:10px;border-top:1px solid var(--line)}
.lsn .scr{display:flex;gap:10px;font-size:13px;align-items:baseline;flex-wrap:wrap}
.lsn .scr>span:first-child{width:44px}
.lsn .note-warn{margin-top:10px}
.lsn.retired p{color:var(--t3);text-decoration:line-through;text-decoration-color:var(--t3)}
.chip.cause-luck{color:var(--t3);box-shadow:inset 0 0 0 1px var(--line);background:transparent}
.lsn .hd>span{white-space:nowrap}
.lsn .tags{margin-top:8px}
.meta.sub{margin-top:10px;font-size:12px;color:var(--t3);line-height:1.6}
.conc .kv2{display:grid;grid-template-columns:92px 1fr;gap:8px;font-size:13px;padding:6px 0;align-items:baseline}
.conc .cvs{display:flex;flex-wrap:wrap;gap:6px}
.conc .cv{display:inline-flex;height:24px;align-items:center;padding:0 8px;border-radius:6px;background:var(--chip);color:var(--t2);font-variant-numeric:tabular-nums}
.conc .cv.hi{color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn);background:transparent;font-weight:600}
.conc .sm{font-size:12px;line-height:1.6}

.appnew{display:block;margin:12px 0 4px;padding:12px 14px;border-radius:14px;background:#1f2a44;color:#fff;text-decoration:none}
.appnew b{display:block;font-size:15px}
.appnew span{display:block;font-size:12.5px;color:#b9c3d6;margin-top:2px}

details.ro{margin-top:14px}
details.ro>summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none}
details.ro>summary .t3{font-weight:400;font-size:12px;margin-left:6px}

/* 홈 선수 카드 (자산 변동) */
.pc{display:block;padding:16px;margin-top:10px;border-radius:16px;background:var(--surface);font-variant-numeric:tabular-nums}
.pc:active{background:var(--surface2)}
.pc-h{display:flex;align-items:center;gap:8px}
.pc-n{font-size:15px;font-weight:600;white-space:nowrap}
.pc-pf{margin-left:auto;font-size:12px;color:var(--t3);white-space:nowrap}
.pc-eq{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:8px;line-height:1.2;white-space:nowrap}
.pc-eq.sm{font-size:22px}
.pc-cs{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:6px}
.pc-c{display:flex;flex-direction:column;min-width:0}
.pc-l{font-size:11px;color:var(--t3)}
.pc-c .num{font-size:14px;font-weight:600;white-space:normal;word-break:keep-all}
.pc-p{font-weight:500;font-size:13px}
.pc-f{font-size:12px;color:var(--t3);margin-top:6px;white-space:normal;word-break:keep-all}

/* 홈 오늘의 거래 (거래내역 형식) */
.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .mono{flex:none}
.tx-b{flex:1 1 auto;min-width:0}
.tx-t{font-size:15px;font-weight:600;white-space:normal;word-break:keep-all;line-height:1.35}
.tx-s{font-size:12px;color:var(--t3);margin-top:2px;white-space:normal;line-height:1.35}
.tx-r{flex:none;text-align:right}
.tx-v{font-size:15px;font-weight:600;white-space:nowrap}
.tx .num,.tx-v{font-variant-numeric:tabular-nums}
</style>
</head>

function mktSession(m){
  if(m.tradable||m.open) return m.session||'regular';
  var r=m.reason||''; if(/주말/.test(r)) return 'weekend'; if(/휴장/.test(r)) return 'holiday'; if(/실패/.test(r)) return 'unknown';
  return 'night';
}
function mktPill(){
  var m=D.market||{}, chk=m.checked_at||D.generated_at, age=(Date.now()-new Date(chk).getTime())/6e4;
  var s=mktSession(m), stale=age>15;
  if(stale){var c2=clockSession(); if(c2!==s&&!(s==='holiday'&&c2!=='weekend')) s=c2;}
  var live=s==='pre'||s==='regular'||s==='post';
  var c=live?(stale?'mkt stale':'mkt on'):'mkt', t=SESS[s]||'장외';
  if(stale) t+=' · 갱신 지연';
  return '<span class="'+c+'" id="mkt"><i></i>'+t+'</span>';
}
function quoteLine(){

/* ---------- 실시간 시세: live 브랜치의 30초 버킷 (빌드 없이 수십 초) ---------- */
var LIVE={q:null,ts:null,last:0,lag:0,timer:null};
function liveApply(){
  if(!D||!LIVE.q) return;
  if(D.prices&&D.prices.as_of&&LIVE.ts&&new Date(D.prices.as_of)>=new Date(LIVE.ts)&&!D.prices.live) return;
  var q=LIVE.q, latest=null;
  (D.players||[]).forEach(function(p){
    var dv=0;
    (p.holdings||[]).forEach(function(h){
      var x=q[h.symbol]; if(!x||!h.shares||!h.last) return;
      var fx=h.value_krw/(h.shares*h.last), nv=h.shares*x.p*fx;
      dv+=nv-h.value_krw; h.value_krw=nv; h.last=x.p; h.quote_time=x.t;
      if(h.avg_cost) h.pl_pct=(x.p/h.avg_cost-1)*100;
      if(x.pc) {h.prev_close=x.pc; h.day_pct=(x.p/x.pc-1)*100;}
      if(!latest||x.t>latest) latest=x.t;
    });
    if(dv){var base=p.equity_krw-p.pl_krw; p.equity_krw+=dv; p.pl_krw+=dv; if(base) p.return_krw_pct=p.pl_krw/base*100;}
  });
  D.prices=D.prices||{}; D.prices.as_of=LIVE.ts||latest; D.prices.live=true;  // 기준 시각 = 시세를 조회한 시각
}
function livePoll(){
  var f=D&&D.live_feed, m=D&&D.market||{};
  if(!f||!f.base) return;
  var s=mktSession(m); if(s!=='pre'&&s!=='regular'&&s!=='post') return;
  var b=f.bucket||30, want=Math.floor((Date.now()/1000-(f.ready_after_s||20)-LIVE.lag)/b)*b;
  if(want<LIVE.last||(want===LIVE.last&&!LIVE.retry)) return;
  var url=f.base+want+'.json'+(want===LIVE.last&&LIVE.retry?'?r='+LIVE.retry:'');
  LIVE.last=want;
  fetch(url,{cache:'default'}).then(function(r){
    if(!r.ok){ // 404가 CDN에 캐시됐을 수 있음 → 같은 버킷을 다른 키로 한 번 더, 그다음엔 여유를 늘림
      if(!LIVE.retry){LIVE.retry=1;} else {LIVE.retry=0;LIVE.lag=Math.min(LIVE.lag+b,2*b);}
      throw 0;}
    LIVE.retry=0;
    return r.json();
  }).then(function(x){
    if(!x||!x.q) return; LIVE.lag=Math.max(0,LIVE.lag-5);
    LIVE.q=x.q; LIVE.ts=x.ts; var y=window.scrollY; liveApply(); render(true); window.scrollTo(0,y);
  }).catch(function(){});
}

function kwon(x,sign){ // 큰 금액은 억/만 단위로 축약(말줄임 없이)
  x=Math.round(Number(x)||0); var s=sign?(x>0?'+':x<0?'-':''):(x<0?'-':''), v=Math.abs(x);
  if(v>=1e8) return s+(v/1e8).toFixed(2).replace(/\.?0+$/,'')+'억원';
  if(v>=1e7&&sign) return s+(v/1e4).toLocaleString('ko-KR',{maximumFractionDigits:1})+'만원';
  return s+n0(v)+'원';
}
function dayBase(p){ // 오늘 변동의 기준: 오늘 이전 마지막 자산(없으면 시작금 1천만원)
  var t=new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'}), hs=p.equity_hist||[], b=null;
  for(var i=hs.length-1;i>=0;i--){if(hs[i].date<t){b=hs[i].krw;break;}}
  return b||(p.equity_krw-p.pl_krw);
}
function holdLine(p){
  var hs=(p.holdings||[]).filter(function(h){return h.shares>0;}), eq=p.equity_krw||1, c=Math.round((p.cash_krw||0)/eq*100);
  var a=hs.slice().sort(function(x,y){return (y.value_krw||0)-(x.value_krw||0);});
  var t=a.slice(0,2).map(function(h){return esc(h.symbol)+' '+n0(h.shares)+'주';}).join(' · ');
  if(a.length>2) t+=' 외 '+(a.length-2)+'종목';
  return (t?t+' · ':'')+'현금 '+c+'%';
}

/* ---------- 차트 ---------- */
function smooth(pts){
  if(pts.length<2) return pts.length?'M'+pts[0][0]+','+pts[0][1]:'';
  var d='M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1);
  for(var i=0;i<pts.length-1;i++){
    var p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2, t=.18;
    var c1x=p1[0]+(p2[0]-p0[0])*t, c1y=p1[1]+(p2[1]-p0[1])*t, c2x=p2[0]-(p3[0]-p1[0])*t, c2y=p2[1]-(p3[1]-p1[1])*t;
    var lo=Math.min(p1[1],p2[1]), hi=Math.max(p1[1],p2[1]); c1y=Math.max(lo,Math.min(hi,c1y)); c2y=Math.max(lo,Math.min(hi,c2y));
    d+='C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1);
  }
  return d;
}
function chart(p){

  var q=(D.bench_hist&&D.bench_hist.QQQ)||[], q0=q.length?q[0].close:null, qmap={};
  q.forEach(function(x){qmap[x.date]=x.close;});
  var ser=hist.map(function(x){var qc=qmap[x.date];return {d:x.date,v:x.krw,q:(q0&&qc)?start*qc/q0:null};});
  var W=390,H=200,padT=28,padB=12, all=[];
  ser.forEach(function(s){all.push(s.v);if(s.q)all.push(s.q);});
  var lo=Math.min.apply(null,all), hi=Math.max.apply(null,all), r=(hi-lo)||hi*0.01; lo-=r*.08; hi+=r*.08;
  var X=function(i){return 20+i*(W-40)/(ser.length-1);}, Y=function(v){return padT+(hi-v)/(hi-lo)*(H-padT-padB);};
  var pts=ser.map(function(s,i){return [X(i),Y(s.v)];}), qp=ser.filter(function(s){return s.q;}).map(function(s){return [X(ser.indexOf(s)),Y(s.q)];});
  var col=esc(p.color||'#8A909B'), last=pts[pts.length-1], up=ser[ser.length-1].v>=start;
  var line=up?'var(--up)':'var(--down)';
  var svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="자산 추이 그래프">'+
    '<line x1="20" x2="'+(W-20)+'" y1="'+Y(start).toFixed(1)+'" y2="'+Y(start).toFixed(1)+'" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4" vector-effect="non-scaling-stroke"/>'+
    (qp.length>1?'<path d="'+smooth(qp)+'" fill="none" stroke="var(--t3)" stroke-opacity=".7" stroke-width="1.25" vector-effect="non-scaling-stroke"/>':'')+
    '<path d="'+smooth(pts)+'" fill="none" stroke="'+line+'" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'+
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3.5" fill="'+line+'"/>'+
    '<g class="cur" style="display:none"><line y1="'+padT+'" y2="'+(H-padB)+'" stroke="var(--t3)" stroke-width="1" vector-effect="non-scaling-stroke"/><circle r="4" fill="'+line+'" stroke="var(--bg)" stroke-width="2"/></g></svg>';
  window.__chart={ser:ser,X:X,Y:Y,W:W};
  return '<div class="chart" id="chart">'+svg+'<div class="tip num" id="tip"></div></div>'+

function bindChart(){
  var el=document.getElementById('chart'); if(!el||!window.__chart) return;
  var C=window.__chart, svg=el.querySelector('svg'), cur=svg.querySelector('.cur'), tip=document.getElementById('tip');
  function at(clientX){
    var r=svg.getBoundingClientRect(), x=(clientX-r.left)/r.width*C.W, n=C.ser.length;
    var i=Math.max(0,Math.min(n-1,Math.round((x-20)/((C.W-40)/(n-1))))), s=C.ser[i];
    cur.style.display=''; cur.querySelector('line').setAttribute('x1',C.X(i)); cur.querySelector('line').setAttribute('x2',C.X(i));
    var c=cur.querySelector('circle'); c.setAttribute('cx',C.X(i)); c.setAttribute('cy',C.Y(s.v));
    var px=C.X(i)/C.W*r.width; tip.style.left=Math.max(70,Math.min(r.width-70,px))+'px';
    var dd=s.d.split('-');
    tip.innerHTML=(+dd[1])+'/'+(+dd[2])+' · '+won(s.v)+(s.q?' <span class="t3">QQQ '+won(s.q)+'</span>':'');
    el.classList.add('scrub');
  }
  function end(){cur.style.display='none';el.classList.remove('scrub');}
  el.addEventListener('pointerdown',function(e){at(e.clientX);});
  el.addEventListener('pointermove',function(e){if(e.pointerType==='mouse'||e.buttons||e.pressure)at(e.clientX);});
  el.addEventListener('pointerup',end);el.addEventListener('pointerleave',end);el.addEventListener('pointercancel',end);
}

      h+='<a class="erow" href="'+esc(e.source)+'" target="_blank" rel="noopener"><span><b>'+esc(e.symbol)+'</b> <span class="sub">'+esc(e.period)+'</span></span>'+
         '<span class="num">'+(+d[1])+'월 '+(+d[2])+'일 '+esc(e.when)+' <span class="sub">'+esc(e.session)+'</span></span></a>';});
    h+='</section>';
  }
  h+='<section class="sec"><div class="sec-h"><h2>엔진 조건</h2></div><ul class="rl">'+ec.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></section>';
  h+='<section class="sec"><div class="sec-h"><h2>점수</h2></div><ul class="rl">'+
     '<li>순위는 Profit Factor(총이익 ÷ 총손실)로 정합니다.</li>'+
     '<li>모든 매수에는 가설(시나리오, 근거, 확인 시점, 맞으면, 틀리면)이 있어야 합니다. 판정은 가격이 아니라 시나리오가 실제로 일어났는지로 합니다.</li>'+
     '<li>가설을 닫을 때는 교훈을 남깁니다. 기한이 지난 가설에 교훈이 없으면 새 매수가 막힙니다.</li>'+
     '<li>진행 중인 가설은 이유를 적고 수정할 수 있습니다. 원문과 수정 이력은 그대로 남습니다.</li></ul></section>';
  h+='<p class="disc">모의투자 · 가상 1천만원 · 실제 돈 아님. 투자 권유가 아닙니다. 시세는 Yahoo 기준이며 늦거나 바뀔 수 있습니다.<br>'+updLine()+'</p></div>';
  return h;
}

/* ---------- 라우터 ---------- */
function render(keep){
  var r=(location.hash||'#/').slice(2).split('/'), h, tab='home';
  if(r[0]==='p'){h=pPage(decodeURIComponent(r[1]||''),r[2]);tab='';}
  else if(r[0]==='feed'){h=feed(r[1]);tab='feed';}
  else if(r[0]==='rules'){h=rules();tab='rules';}
  else if(r[0]==='notes'){h=notes(r[1]);tab='notes';}
  else h=home();
  window.__chart=null;
  app.innerHTML=h;
  if(keep){var v=app.querySelector('.view');if(v)v.style.animation='none';}
  bindChart();
  [].forEach.call(document.querySelectorAll('.tabbar a'),function(a){var on=a.getAttribute('data-tab')===tab;a.className=on?'on':'';if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  if(!keep) window.scrollTo(0,0);
}
window.addEventListener('hashchange',function(){if(D)render();});
if('serviceWorker' in navigator && !window.__LEAGUE_DATA__ && location.protocol.indexOf('http')===0){
  var hadCtl=!!navigator.serviceWorker.controller, reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(hadCtl&&!reloaded){reloaded=true;location.reload();}});
  navigator.serviceWorker.register('sw.js').then(function(r){r.update();setInterval(function(){r.update();},30*6e4);}).catch(function(){});
}
if(window.__LEAGUE_DATA__){D=window.__LEAGUE_DATA__;render();}
else{
  var q=new URLSearchParams(location.search), src=q.get('data')||'data.json';
  if(!/^[\w.\-]+\.json$/.test(src)) src='data.json';
  var load=function(first){
    return fetch(src+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
      if(first) BUILD0=d.web_build;
      else if(d.web_build&&BUILD0&&d.web_build!==BUILD0){location.reload();return;}
      if(first||!D||d.generated_at!==D.generated_at){var y=window.scrollY;D=d;liveApply();render(!first);if(!first)window.scrollTo(0,y);}else liveBar();
    });
  };
  load(true).catch(function(){app.innerHTML='<div class="view"><div class="empty">데이터를 불러오지 못했어요. 잠시 후 다시 열어 주세요.</div></div>';});
  var BUILD0=null;
  setInterval(function(){load(false).catch(liveBar);},60000);
  setInterval(livePoll,5000); setTimeout(livePoll,1500);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&D){load(false).catch(function(){});livePoll();}});
}
})();
</script>
